<style>
  :root {
    --bg: #fbfaf8;
    --surface: #ffffff;
    --text: #1c1b19;
    --muted: #6b6862;
    --line: #e7e4de;
    --accent: #c8102e;           /* POSTECH red */
    --accent-soft: #fbeaec;
    --chip: #f3f1ec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --surface: #1c1b1a; --text: #ecebe7; --muted: #9c9891;
      --line: #2e2d2a; --accent: #ff5a6e; --accent-soft: #3a1c21; --chip: #262523;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413; --surface: #1c1b1a; --text: #ecebe7; --muted: #9c9891;
    --line: #2e2d2a; --accent: #ff5a6e; --accent-soft: #3a1c21; --chip: #262523;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.7 "Inter", "Noto Sans KR", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }

  /* nav */
  nav {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; gap: 12px; }
  nav .brand { font-weight: 700; color: var(--text); white-space: nowrap; }
  nav ul { display: flex; gap: 20px; list-style: none; margin: 0; padding: 0; overflow-x: auto; }
  nav ul a { color: var(--muted); font-size: 14px; font-weight: 500; }
  nav ul a:hover { color: var(--text); text-decoration: none; }
  .theme-btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    border-radius: 8px; width: 34px; height: 34px; cursor: pointer; flex: none;
  }

  /* hero */
  header.hero { padding: 64px 0 40px; display: grid; grid-template-columns: 168px 1fr; gap: 36px; align-items: center; }
  .avatar {
    width: 168px; height: 168px; border-radius: 50%; object-fit: cover;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; font-size: 56px; font-weight: 700;
    border: 4px solid var(--surface); box-shadow: 0 0 0 1px var(--line);
  }
  .hero h1 { margin: 0; font-size: 36px; line-height: 1.2; letter-spacing: -0.02em; }
  .hero .name-ko { color: var(--muted); font-weight: 500; font-size: 20px; margin-left: 6px; }
  .hero .role { margin: 8px 0 0; font-size: 17px; }
  .hero .affil { margin: 2px 0 0; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .links a {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface); color: var(--text); font-size: 14px; font-weight: 500;
  }
  .links a:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
  .links svg { width: 15px; height: 15px; }

  /* sections */
  section { padding: 36px 0; border-top: 1px solid var(--line); scroll-margin-top: 56px; }
  section h2 { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin: 0 0 18px; }
  .about p { margin: 0 0 12px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--chip); padding: 6px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; }

  .news li { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 6px 0; }
  .news time { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  ul.plain { list-style: none; margin: 0; padding: 0; }

  .timeline li { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 10px 0; }
  .timeline .t { font-weight: 600; }
  .timeline .s { color: var(--muted); font-size: 15px; grid-column: 1; }
  .timeline .d { color: var(--muted); font-size: 14px; white-space: nowrap; grid-row: 1; grid-column: 2; }

  .pubs li { padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .pubs li:last-child { border-bottom: 0; }
  .pubs .title { font-weight: 600; }
  .pubs .authors { font-size: 15px; }
  .pubs .authors b { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
  .pubs .venue { color: var(--muted); font-size: 14px; font-style: italic; }
  .pubs .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); margin-right: 6px; font-style: normal; }
  .pubs .title a { color: var(--text); }
  .pubs .title a:hover { color: var(--accent); }
  .pubs .tag { margin: 0 0 0 6px; }
  .pub-group { font-size: 17px; margin: 28px 0 4px; }
  .pub-group:first-of-type { margin-top: 0; }
  .pub-group span { font-size: 13px; font-weight: 600; color: var(--muted); background: var(--chip); padding: 1px 8px; border-radius: 6px; margin-left: 4px; }
  img.avatar { object-position: center 20%; }

  .projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .card h3 { margin: 0 0 6px; font-size: 16px; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }

  footer { padding: 32px 0 48px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }

  @media (max-width: 640px) {
    header.hero { grid-template-columns: 1fr; text-align: center; padding-top: 40px; gap: 20px; }
    .avatar { margin: 0 auto; width: 128px; height: 128px; font-size: 44px; }
    .hero h1 { font-size: 28px; }
    .hero .name-ko { display: block; margin: 4px 0 0; }
    .links { justify-content: center; }
    nav ul { display: none; }
    .news li { grid-template-columns: 1fr; gap: 0; }
    .timeline li { grid-template-columns: 1fr; }
    .timeline .d { grid-row: auto; grid-column: 1; }
  }
</style>
</head>

      `<h3 class="pub-group">${esc(g.group)} <span>${g.items.length}</span></h3><ol class="plain pubs">${g.items.map((p) => {
        const authors = esc(p.authors).split(esc(P.me)).join(`<b>${esc(P.me)}</b>`);
        return `<li><div class="title">${p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title)}</div><div class="authors">${authors}</div><div class="venue">${esc(p.venue)}${p.award ? ` <span class="tag">🏆 ${esc(p.award)}</span>` : ""}</div></li>`;
      }).join("")}</ol>`).join("")],
    ["projects", "Projects", P.projects, (a) => `<div class="projects">${a.map((p) =>
      `<div class="card"><h3>${p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title)}</h3><p>${esc(p.desc)}</p></div>`).join("")}</div>`],
    ["awards", "Awards", P.awards, timeline],
  ].filter(([, , data]) => data && data.length);

  $("sections").innerHTML = sections.map(([id, title, data, render]) =>
    `<section id="${id}"><h2>${title}</h2>${render(data)}</section>`).join("");
  $("nav-links").innerHTML = sections.filter(([id]) => id !== "interests")
    .map(([id, title]) => `<li><a href="#${id}">${title}</a></li>`).join("");

  // theme toggle (remembered per browser)
  const root = document.documentElement;
  try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch (e) {}
  $("theme-btn").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
  });
})();
</script>
</body>
</html>
